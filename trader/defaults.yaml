# 交易參數預設值。請勿直接修改這個檔案。
# 你修改過的值會存在 trader/config.yaml（只記錄跟預設不同的項目，不提交到儲存庫），
# 程式啟動時以「預設值 + 你的設定」合併使用。修改方式：
#   python -m trader.settings show                                  顯示目前設定
#   python -m trader.settings set daytrade.exit.take_profit_pct 5   修改並儲存
#   python -m trader.settings reset daytrade.exit.take_profit_pct   改回預設

mode: daytrade              # daytrade（當沖）或 swing（波段）
broker: paper               # paper（程式內模擬）、kgi_sim（凱基模擬環境）、kgi_live（凱基正式環境，真實下單）
kgi:
  account: ""               # 證券帳號（依 show_account() 結果填寫；身分證與密碼不寫在這裡，啟動時輸入）
max_watchlist: 30           # 同時訂閱報價的檔數上限，依帳號等級調整（新星 30、菁英 50、尊爵 100）
order_confirm: manual       # manual（確認才送單，預設）或 auto（全自動免確認）
confirm_timeout_sec: 60     # 本機視窗確認的逾時秒數，逾時自動取消

capital: 5000000            # 總資金（元），預設 500 萬

universe:
  stages: [2]               # 要交易的階段，例如 [2]、[4]、[1, 2]
  trend_template: true      # 是否要求趨勢樣板八項全過
  min_rs: 70                # RS 最低門檻
  min_avg_volume_lots: 1000 # 50 日均量最少幾張

daytrade:
  direction: long           # long（先買後賣）或 short（先賣後買）
  opening_range_minutes: 15 # 開盤區間長度（分鐘）
  min_range_pct: 0.8        # 開盤區間寬度下限 %
  max_range_pct: 4.0        # 開盤區間寬度上限 %
  or_volume_ratio: 0.15     # 開盤區間累計量 ≥ 50 日均量 × 此值（0 表示不檢查）
  limit_buffer_pct: 1.5     # 距漲跌停不足此 % 不進場
  entry:
    start: "09:15"          # 最早進場時間
    end: "10:00"            # 最晚進場時間
  exit:
    stop_loss_pct: 2.0      # 停損 %（與開盤區間另一端取較近者）
    take_profit_pct: 6.0    # 停利 %，留空表示不設
    force_close: "13:10"    # 強制平倉時間
  max_amount_per_trade: 300000  # 單筆金額上限（元），例如 30 萬
  max_entries_per_symbol: 1

swing:
  max_contraction: 0.8
  max_vol_ratio: 1.0
  pivot_lookback: 20
  breakout_volume_ratio: 1.4
  max_chase_pct: 5.0
  entry_timing: intraday    # intraday（盤中突破）或 next_open（隔天開盤）
  stop_loss_pct: 7.0        # 上限 8
  breakeven_r: 2.0
  ma_break_volume_ratio: 1.0
  partial_take_pct: 20.0    # 留空表示不分批
  partial_take_size: 0.5
  max_position_pct: 25.0
  lot_mode: lot             # lot（只買整張）或 odd（允許零股：整張部分下整股單，不足一張下盤中零股單）

risk:
  risk_per_trade_pct: 1.0
  max_positions: 3
  max_daily_loss_pct: 3.0
  max_orders_per_day: 10
  flatten_on_stop: true     # 緊急停止時是否平掉所有當沖部位

costs:                      # 交易成本（回測與模擬下單使用）
  fee_rate: 0.001425        # 手續費率（法定上限 0.1425%）
  fee_discount: 1.0         # 手續費折扣，例如 2.8 折填 0.28
  min_fee: 20               # 每筆最低手續費（元）
  tax_rate: 0.003           # 一般賣出證交稅 0.3%
  tax_day_trade: 0.0015     # 現股當沖賣出證交稅 0.15%（優惠稅率，請依最新規定調整）
  slippage_ticks: 1         # 模擬成交時，市價單多付（少收）幾檔

notify:
  channel: line             # line（LINE 官方帳號機器人推播）或 none（不通知）
  # 金鑰不寫在這裡，請設成環境變數（或寫在 trader/.env，不會提交）：
  #   LINE_CHANNEL_ACCESS_TOKEN  官方帳號的 Channel access token
  #   LINE_TO                    接收通知的 LINE 使用者 ID（U 開頭）
  on_signal: true           # 出現進場訊號（含等待確認的委託）
  on_fill: true             # 成交
  on_exit: true             # 出場（停損、停利、強制平倉）
  on_error: true            # 錯誤、斷線、對帳不一致
  daily_summary: true       # 收盤後每日總結
